name: Engine core

# Runs on free Linux runners. Everything in core/ is platform-agnostic by
# design, so the bulk of the engine gets tested here at no cost and without
# waiting on a macOS runner.

on:
  push:
    branches: [main]
    # The build commits source.json back to main. Without this, that push
    # would trigger another build, which would push again, forever.
    paths-ignore: [source.json]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # Cheap, and it guards a rule that had only ever been stated in a commit
      # message — where, by this project's own principle about deferred tasks,
      # nobody will find it. It was then recounted by hand with an ad-hoc awk
      # one-liner, twice, in two sessions. A habit is not a check.
      #
      # Linux only: it reads two text files and would be the same answer twice.
      - name: Completeness table matches the taxonomy
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/check_taxonomy.py

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      # Verbose on purpose. The tile tests print real memory figures, and
      # having those in the log of every push is how we notice a regression in
      # sparsity long before it shows up as an out-of-memory crash on device.
      - name: Test
        run: ctest --test-dir build --build-config Release --verbose
