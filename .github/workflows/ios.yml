name: iOS build

# Two jobs in one: verify the app on a simulator, then produce an UNSIGNED
# .ipa as a workflow artifact.
#
# Signing happens later on Windows, in Sideloadly, using a free Apple ID —
# which is why this workflow needs no certificates, no provisioning profiles
# and no repository secrets.
#
# The simulator step is the important half. Every bug that has cost real time
# on this project lived in the Swift shell, where the C++ test suite could not
# see it. GitHub's macOS runners are Apple silicon, so the simulator runs real
# Metal, and shaders can be checked against the CPU reference in core/blend.cpp
# without anyone owning a Mac.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Test and build unsigned .ipa
    runs-on: macos-15

    # Publishing releases needs write access to repository contents. Nothing
    # else in this workflow writes anything, so this is the only elevation.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes are built from the commits since the previous tag, and
          # the default shallow clone has none of them.
          fetch-depth: 0

      - name: Version this build
        id: version
        run: |
          # The marketing version MUST change on every build. SideStore decides
          # whether an update exists by comparing this string, and project.yml
          # hardcodes 0.0.1 for local builds — left alone, every build would
          # look identical to the one already installed and no update would ever
          # be offered. The run number is monotonic and never reused.
          VERSION="0.1.${{ github.run_number }}"
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "build=${{ github.run_number }}"
          } >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (build ${{ github.run_number }})"

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          cmake --version | head -n 1
          sw_vers

      - name: Install XcodeGen, Ninja and xcbeautify
        run: brew install xcodegen ninja xcbeautify

      - name: Build engine core for iOS device (arm64)
        run: |
          cmake -B build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ios

      - name: Verify core library is iOS arm64
        run: |
          test -f build-ios/lib/libcore.a || { echo "::error::libcore.a was not produced"; exit 1; }
          lipo -info build-ios/lib/libcore.a
          lipo -info build-ios/lib/libcore.a | grep -q arm64 \
            || { echo "::error::libcore.a is not arm64"; exit 1; }

      - name: Build engine core for the iOS Simulator
        run: |
          # Both architectures, not just arm64. A simulator destination on
          # an Apple silicon runner resolves to arm64 AND x86_64, and
          # xcodebuild picked x86_64. Against an arm64-only library that
          # surfaces as "undefined symbol" for every core function, which
          # looks nothing like an architecture problem.
          cmake -B build-sim -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-sim

          echo "Simulator library architectures:"
          lipo -info build-sim/lib/libcore.a
          lipo -info build-sim/lib/libcore.a | grep -q x86_64 \
            || { echo "::error::simulator libcore.a lacks an x86_64 slice"; exit 1; }

      - name: Package core as an xcframework
        run: |
          # Device and simulator slices share an architecture but not a
          # platform, so lipo cannot merge them — an xcframework is the
          # mechanism that exists for exactly this, and Xcode picks the right
          # slice per SDK with no search paths involved.
          rm -rf build-xc
          mkdir -p build-xc
          xcodebuild -create-xcframework             -library build-ios/lib/libcore.a             -library build-sim/lib/libcore.a             -output build-xc/core.xcframework
          find build-xc/core.xcframework -name '*.a' | sort

      - name: Generate Xcode project
        working-directory: shell_ios
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          # Resolved by id rather than by name: device names differ between
          # Xcode images, and a stale name fails with an unhelpful
          # "destination not found".
          xcrun simctl list devices available --json > devices.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("devices.json") as f:
              data = json.load(f)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if not device.get("isAvailable"):
                      continue
                  # Prefer an iPad; it is the platform we actually target.
                  rank = 0 if "iPad" in device["name"] else 1
                  if best is None or rank < best[0]:
                      best = (rank, device["udid"], device["name"])
          if best is None:
              raise SystemExit("no available iOS simulator")
          print("udid=" + best[1])
          print("name=" + best[2])
          PY
          echo "Selected simulator: $(grep '^name=' "$GITHUB_OUTPUT" | tail -1)"

      - name: Run tests on the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -project shell_ios/MangaChan.xcodeproj \
            -scheme MangaChan \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }},arch=arm64" \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-test.log \
            | xcbeautify --renderer github-actions

      - name: Test measurements
        if: always()
        run: |
          # xcbeautify drops test stdout, and for the blend comparison
          # those numbers are the point rather than chatter. A passing
          # test says the GPU matched the CPU; it does not say whether it
          # matched by one level or by the whole tolerance, which is the
          # difference between comfortable and fragile.
          grep -E 'blend shaders:|worst case:|rejects programmable' \
            xcodebuild-test.log || echo '(no measurements printed)'

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project shell_ios/MangaChan.xcodeproj \
            -scheme MangaChan \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-app \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} \
            build

      - name: Verify app bundle
        run: |
          APP="build-app/Build/Products/Release-iphoneos/MangaChan.app"
          test -d "$APP" || { echo "::error::app bundle missing"; exit 1; }

          # A missing metallib is a silent black screen on device, so catch it here.
          test -f "$APP/default.metallib" \
            || { echo "::error::default.metallib missing — the .metal file did not compile"; exit 1; }

          # The version override is passed on the xcodebuild command line, so a
          # typo or a renamed build setting would fail silently and ship a build
          # that still calls itself 0.0.1 — which SideStore would ignore forever.
          # Cheaper to assert it than to debug an update that never arrives.
          STAMPED=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          echo "Info.plist reports version $STAMPED"
          test "$STAMPED" = "${{ steps.version.outputs.version }}" \
            || { echo "::error::version not stamped — plist says '$STAMPED', expected '${{ steps.version.outputs.version }}'"; exit 1; }

          lipo -info "$APP/MangaChan"
          echo "Bundle contents:"
          ls -la "$APP"

      - name: Package .ipa
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build-app/Build/Products/Release-iphoneos/MangaChan.app Payload/
          zip -qry MangaChan.ipa Payload
          ls -lh MangaChan.ipa

      # Kept alongside the release: artifacts are authenticated and expire in 30
      # days, which is fine as a build log attachment and useless as a download
      # target. The release is the one SideStore reads.
      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaChan-ipa
          path: MangaChan.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          # Commits since the previous build, so a release says what changed
          # rather than only that it exists.
          PREVIOUS=$(git tag -l 'v0.1.*' --sort=-version:refname | head -n 1 || true)
          if [ -n "$PREVIOUS" ]; then
            RANGE="$PREVIOUS..HEAD"
            SINCE="since $PREVIOUS"
          else
            RANGE="HEAD~10..HEAD"
            SINCE="last 10 commits"
          fi
          git log --no-merges --pretty='- %s' "$RANGE" > changes.txt 2>/dev/null || git log --no-merges -10 --pretty='- %s' > changes.txt

          {
            echo "> **Internal pre-alpha.** Not a public build. Milestones M3 onward"
            echo "> are still open — see [ROADMAP.md](https://github.com/${{ github.repository }}/blob/main/ROADMAP.md)"
            echo "> for what works and [TESTING.md](https://github.com/${{ github.repository }}/blob/main/TESTING.md)"
            echo "> for what is known broken."
            echo
            echo "### Install"
            echo
            echo "Through the SideStore source, which offers this as an update automatically:"
            echo
            echo '```'
            echo "https://github.com/${{ github.repository }}/releases/download/sidestore-source/source.json"
            echo '```'
            echo
            echo "The \`.ipa\` below also installs directly. It is **unsigned** — SideStore"
            echo "signs it on device with your free Apple ID, so it stops launching 7 days"
            echo "after install and reinstalling resets that."
            echo
            echo "### Changes ($SINCE)"
            echo
            cat changes.txt
            echo
            echo "---"
            echo
            echo "Built from \`${{ github.sha }}\` by run [${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } > notes.md

          # Re-running a build must not fail on an existing tag.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

          gh release create "$TAG" MangaChan.ipa \
            --title "Manga-Chan $VERSION — internal pre-alpha" \
            --notes-file notes.md \
            --prerelease \
            --target "${{ github.sha }}"

          echo "Published $TAG"

      - name: Refresh the SideStore source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          SIZE=$(stat -f%z MangaChan.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BASE="https://github.com/${{ github.repository }}/releases/download"

          # The app object carries `version`/`downloadURL` at the top level AND a
          # `versions` array holding the same thing. That duplication is
          # deliberate: SideStore requires the top-level downloadURL even when a
          # versions array is present, where AltStore infers it from the newest
          # entry. SideStore's own published source does the same.
          cat > source.json <<JSON
          {
            "name": "Manga-Chan (internal)",
            "identifier": "com.octolex.mangachan.source",
            "sourceURL": "$BASE/sidestore-source/source.json",
            "apps": [
              {
                "name": "Manga-Chan",
                "bundleIdentifier": "com.octolex.mangachan",
                "developerName": "octolex",
                "subtitle": "Internal pre-alpha — manga drawing app for iPad",
                "localizedDescription": "A manga-oriented drawing app for iPad. Internal pre-alpha: the tiled canvas, compositor and brush engine work; grain and several brush settings do not yet. See ROADMAP.md and TESTING.md in the repository.",
                "iconURL": "https://avatars.githubusercontent.com/u/4704228?v=4",
                "tintColor": "2A6BD9",
                "category": "entertainment",
                "version": "$VERSION",
                "versionDate": "$DATE",
                "versionDescription": "Internal pre-alpha build $VERSION, from ${{ github.sha }}.",
                "downloadURL": "$BASE/$TAG/MangaChan.ipa",
                "size": $SIZE,
                "versions": [
                  {
                    "version": "$VERSION",
                    "date": "$DATE",
                    "localizedDescription": "Internal pre-alpha build $VERSION, from ${{ github.sha }}.",
                    "downloadURL": "$BASE/$TAG/MangaChan.ipa",
                    "size": $SIZE,
                    "minOSVersion": "17.0"
                  }
                ]
              }
            ]
          }
          JSON

          python3 -c "import json,sys; json.load(open('source.json'))" \
            || { echo "::error::source.json is not valid JSON"; exit 1; }
          cat source.json

          # A fixed tag, so the URL added to SideStore never changes. Created
          # once, then only its asset is replaced.
          gh release view sidestore-source >/dev/null 2>&1 || \
            gh release create sidestore-source \
              --title "SideStore source (do not delete)" \
              --notes "The app source SideStore reads. Its \`source.json\` asset is replaced by every build so this tag's URL stays stable. Deleting this release breaks updates for anyone who added the source." \
              --prerelease

          gh release upload sidestore-source source.json --clobber
          echo "Source now points at $TAG"
