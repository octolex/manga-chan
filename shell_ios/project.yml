# XcodeGen spec. This file replaces the .xcodeproj you would normally edit in
# Xcode — the project is generated fresh on the CI runner by `xcodegen generate`.
# Edit this on Windows; never commit a .xcodeproj.
#
# Target/product name is "MangaChan" (no hyphen) because that becomes the
# executable name; the hyphenated "Manga-Chan" is the display name shown on
# the iPad home screen.

name: MangaChan

options:
  bundleIdPrefix: com.octolex
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    ONLY_ACTIVE_ARCH: NO
    # iPad only. "1" is iPhone, "2" is iPad.
    TARGETED_DEVICE_FAMILY: "2"

targets:
  MangaChan:
    type: application
    platform: iOS

    sources:
      - path: Sources

    dependencies:
      - framework: ../build-xc/core.xcframework
        embed: false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.octolex.mangachan
        PRODUCT_NAME: MangaChan
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.0.1"
        GENERATE_INFOPLIST_FILE: NO

        # Bridge to the C++ engine core.
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Sources/Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../core/include
        OTHER_LDFLAGS:
          - -lc++

        # Metal: keep fast-math off. A brush engine needs predictable float
        # behaviour more than it needs the last few percent of shader speed,
        # and silent NaN handling differences would be miserable to debug
        # without a frame capture tool.
        MTL_FAST_MATH: NO
        MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE

    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Manga-Chan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}

        # Without this, iOS silently caps the app at 60Hz and every ProMotion
        # latency measurement we take would be wrong.
        CADisableMinimumFrameDuration: true

        # Expose Documents/ in the Files app so diagnostics and crash logs can
        # be pulled off the device. With no Mac and no TestFlight, this is the
        # only channel we have for getting information back off the iPad.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

        UIRequiredDeviceCapabilities:
          - metal
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: true
        UIRequiresFullScreen: false

  MangaChanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      # Compiled into the test bundle's own metallib so the shaders can be
      # rendered and compared against the CPU reference.
      - path: Sources/BlendShaders.metal
      # The dab shaders too, so accumulation and dab shape are pinned in CI
      # rather than judged by eye on the device.
      - path: Sources/Shaders.metal
      - path: Sources/ShaderTypes.h
      # The grain builder, so the harness pins the Metal sampler against the
      # very bytes the app uploads rather than against a second copy of the
      # upload path that would quietly drift from it.
      - path: Sources/GrainTexture.swift
      # The colour picker and the scroll view it lives in. Three bugs reached
      # the device here in one build, all of them visible in a screenshot and
      # invisible to every test we had.
      - path: Sources/ColorPickerView.swift
      - path: Sources/RestorableScrollView.swift
    dependencies:
      - target: MangaChan
      # Linked directly as well as through the host app: a hosted test bundle
      # can usually resolve host symbols via BUNDLE_LOADER, but relying on
      # that produced undefined symbols for every core function.
      - framework: ../build-xc/core.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.octolex.mangachan.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Sources/Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../core/include
          - $(SRCROOT)/Sources
        OTHER_LDFLAGS:
          - -lc++

# XcodeGen does not create schemes unless asked, and `xcodebuild -scheme`
# fails without one. Declared explicitly so CI cannot break on this.
schemes:
  MangaChan:
    build:
      targets:
        MangaChan: all
        MangaChanTests: [test]
    test:
      config: Debug
      targets:
        - MangaChanTests
    run:
      config: Debug
    archive:
      config: Release
